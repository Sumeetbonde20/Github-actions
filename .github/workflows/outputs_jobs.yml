name: output-demo
on: [push]
jobs:
  job-stage-1:
    outputs:
      version: ${{ steps.first.outputs.version }}
    runs-on: ubuntu-latest
    steps:
      - name: stage1
        id: first
        run: echo "version=10.0.1.0" >> "$GITHUB_OUTPUT"

  job-stage-2:
    runs-on: ubuntu-latest
    needs: job-stage-1
    steps:
      - name: stage2
        run: echo " The Version from the job1 is ${{ needs.job-stage-1.outputs.version }}"
