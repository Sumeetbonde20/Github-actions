name: dockerized-app
on: [push]
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"

      - name: Build Jar
        run: mvn clean package

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: firstimage
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t ${{ steps.firstimage.outputs.registry }}/spring-app:${{ github.sha }} .

      - name: Push_Docker_Image
        run: |
          docker push ${{ steps.firstimage.outputs.registry }}/spring-app:${{ github.sha }}

      - name: Configuring EKS Cluster
        run: |
          aws eks update-kubeconfig --region=us-east-1 --name=spring-cluster1

      - name: run the deployment and Service Files
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml

      - name: Update the ECR image
        run: |
          kubectl set image deployment/spring-app spring-app=${{ steps.firstimage.outputs.registry }}/spring-app:${{ github.sha }}

      - name: Check Deployment
        run: |
          kubectl rollout status deployment/spring-app
