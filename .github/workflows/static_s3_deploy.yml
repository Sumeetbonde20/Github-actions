name: Deploying to S3
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repo to ubuntu
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Sync to S3 bucket
        run: aws s3 sync ./ s3://static-web-deploy70204/ --exclude="*" --include="index.html"

# Steps :
# 1. Chechout the code to ubuntu
# 2. Configure AWS cred (within the repos secrets and variables in Github)
# 3. Sync with S3
# 4. Sync = push to S3
# 5. Check the S3 bucket for the index.html file
# 6. Action is triggered automatically as we have push trigger in our workflow file
